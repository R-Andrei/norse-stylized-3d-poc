name: Unity Compile and Edit Mode Tests

on:
  pull_request:
    branches:
      - fufu
  push:
    branches:
      - fufu
  workflow_dispatch:

concurrency:
  group: unity-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  unity-compile:
    name: Unity compile (Edit Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact change head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Fetch current integration branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin fufu

      - name: Policy preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m py_compile .github/scripts/validate_agent_workflow.py
          python3 .github/scripts/validate_agent_workflow.py --self-test
          python3 .github/scripts/validate_agent_workflow.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Compile project and run Edit Mode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.0f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Edit Mode results

      - name: Upload Unity test results
        if: always() && steps.unity-tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          if-no-files-found: warn
